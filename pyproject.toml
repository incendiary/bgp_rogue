[project]
name = "bgp-rogue"
version = "0.1.0"
description = "Detect BGP prefix hijacks by monitoring route announcements via pybgpstream"
requires-python = ">=3.8"
dependencies = ["pybgpstream"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py38"]
